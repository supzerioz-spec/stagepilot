  } catch { return JSON.parse(JSON.stringify(defaultDB)); }
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function currentUser() { return db.users.find(u => u.id === db.currentUserId) || null; }
function calcAge(dob) {
  if (!dob) return null;
  const d = new Date(dob), t = new Date();
  let age = t.getFullYear() - d.getFullYear();
  if (t.getMonth() < d.getMonth() || (t.getMonth() === d.getMonth() && t.getDate() < d.getDate())) age--;
  return age;
}
function isMinor(u) { const a = calcAge(u?.birthDate); return a !== null && a < 18; }

async function syncFromSupabase() {

  try {
    const { data: cloudOffers } = await sb.from('offers').select('*').eq('is_active', true).order('created_at', { ascending: false });

}

function computeMatch(offer, user) {
  if (!user || user.role !== 'CANDIDATE') return { score: 80, reasons: ['Offre adaptée aux 15–25 ans'] };
  let score = 58;
  const reasons = [];
  if (user.city && offer.city.toLowerCase().includes(user.city.toLowerCase())) { score += 18; reasons.push('Même ville'); }
  if (user.contractType && offer.contract === user.contractType) { score += 12; reasons.push('Contrat visé'); }
  if (user.educationLevel && (offer.level.toLowerCase().includes(user.educationLevel.toLowerCase().split(' ')[0]) || (offer.level.includes('Lycée') && user.educationLevel.includes('Lycée')))) {
    score += 10; reasons.push('Niveau adapté');
  }
  if (user.skills && user.skills.split(',').some(s => offer.desc.toLowerCase().includes(s.trim().toLowerCase()) || offer.title.toLowerCase().includes(s.trim().toLowerCase()))) {
    score += 5; reasons.push('Compétences proches');
  }
  return { score: Math.min(98, score), reasons: reasons.length ? reasons : ['Profil compatible'] };
}

function computeCVScore(cvUser) {
  let pts = 20;
  if (cvUser.fullName && cvUser.fullName.length > 3) pts += 15;
  if (cvUser.summary && cvUser.summary.length > 25) pts += 20;
  if (cvUser.skills && cvUser.skills.split(',').filter(Boolean).length >= 3) pts += 15;
  if (cvUser.experiences && cvUser.experiences.length > 0) pts += 15;
  if (cvUser.languages) pts += 8;
  if (cvUser.interests) pts += 7;
  return Math.min(100, pts);
}

function evaluateSimAnswer(step, answer, level) {
  const txt = answer.trim().toLowerCase();
  const words = txt.split(/\s+/).filter(Boolean).length;
  let score = 55;
  const tips = [];
  if (words >= 12) score += 15; else tips.push('Développez un peu plus votre réponse (2 à 4 phrases).');
  if (words >= 25) score += 10;
  if (step === 0 && /(école|lycée|collège|bts|licence|master|étud|stage|motiv|passion|apprendre)/.test(txt)) score += 15;
  else if (step === 0) tips.push(`Mentionnez votre niveau (${level}) et ce que vous voulez apprendre.`);
  if (step === 1 && /(entreprise|équipe|projet|secteur|métier|découvrir|progresser)/.test(txt)) score += 15;
  else if (step === 1) tips.push('Reliez votre motivation au métier concret.');
  if (step === 2 && /(équipe|groupe|aidé|créé|organisé|réussi|problème|solution|sport)/.test(txt)) score += 15;
  else if (step === 2) tips.push('Donnez un exemple concret avec le résultat obtenu.');
  if (step === 3 && (txt.includes('?') || /(semaine|journée|outil|équipe|tuteur|mission)/.test(txt))) score += 18;
  else if (step === 3) tips.push('Posez une vraie question ouverte au recruteur.');
  score = Math.min(98, score);
  const badge = score >= 80 ? '🌟 Excellente réponse !' : score >= 68 ? '👍 Bonne base !' : '💡 À renforcer';
  return { score, feedback: tips.length ? `${badge} Conseil : ${tips.join(' ')}` : `${badge} Réponse structurée et convaincante.` };
}

function submitSimAnswer(e) {
  e.preventDefault();
  const answer = document.getElementById('simAnswer').value.trim();
  if (!answer) return;
  const step = db.sim.step;
  const ev = evaluateSimAnswer(step, answer, db.sim.level);
  db.sim.history.push({ q: SIM_QUESTIONS[step], a: answer, score: ev.score, feedback: ev.feedback });
  db.sim.step = step + 1;
  saveDB(); render();
}
function resetSim() { db.sim.step = 0; db.sim.history = []; saveDB(); render(); }

  comm: { sector: 'Marketing & Communication', jobs: 'Chargé(e) de Communication, Réseaux Sociaux, Création de Contenu', desc: 'Tu sais faire passer des messages et capter l’attention.' },
  commerce: { sector: 'Commerce & Relation Client', jobs: 'Immersion Relation Client, Conseiller(ère) Vente, Gestion de Projet', desc: 'Tu es à l’aise avec l’humain et le contact concret.' }
};
function pickQuizOption(cat) {
  db.quiz.scores[cat] = (db.quiz.scores[cat] || 0) + 1;
  db.quiz.step += 1;
  if (db.quiz.step >= QUIZ_QUESTIONS.length) db.quiz.result = Object.entries(db.quiz.scores).sort((a, b) => b[1] - a[1])[0][0];
  saveDB(); render();
}
function resetQuiz() { db.quiz = { step: 0, scores: { tech: 0, design: 0, comm: 0, commerce: 0 }, result: null }; saveDB(); render(); }
function launchRecommendedOffers(sector) { db.filters = { q: '', city: '', sector, level: '', contract: '' }; go('offers'); }

function toggleGuideStep(idx) { db.checklist[idx] = !db.checklist[idx]; saveDB(); render(); }

function renderOffersList() {
  const box = document.getElementById('offersList');
  if (!box) return;
  const u = currentUser();
  const f = db.filters;
  const list = db.offers
    .filter(o =>
      (!f.q || (o.title + o.desc + o.companyName).toLowerCase().includes(f.q.toLowerCase())) &&
      (!f.city || o.city.toLowerCase().includes(f.city.toLowerCase())) &&
      (!f.sector || o.sector === f.sector) &&
      (!f.level || o.level === f.level) &&
      (!f.contract || o.contract === f.contract)
    )
    .map(o => ({ ...o, match: computeMatch(o, u) }))
    .sort((a, b) => b.match.score - a.match.score);

  box.innerHTML = list.map(o => {
    const isSaved = u && db.saved.some(s => s.userId === u.id && s.offerId === o.id);
    const hasApplied = u && db.applications.some(a => a.userId === u.id && a.offerId === o.id);
    return `
    <div class="card bg-white p-4 rounded-2xl border shadow-sm space-y-2.5">
      <div class="flex justify-between items-start gap-2">
        <div class="flex flex-wrap gap-1.5 items-center">
          <span class="px-2 py-0.5 rounded-full bg-navy-900 text-white text-[10px] font-bold">${esc(o.contract)}</span>
          <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 text-[10px] font-extrabold">⚡ ${o.match.score}% Match</span>
          ${o.isDemo ? '<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[10px] font-bold">DÉMO</span>' : '<span class="px-2 py-0.5 rounded-full bg-blue-100 text-electric-500 text-[10px] font-bold">CLOUD</span>'}
        </div>
        <button onclick="toggleSave('${o.id}')" class="px-2.5 py-1 rounded-lg border text-xs ${isSaved?'bg-blue-50 border-electric-500 text-electric-500 font-bold':'muted'}">${isSaved?'★ Sauvée':'☆ Sauver'}</button>
      </div>
      <div onclick="go('offer_detail','${o.id}')" class="font-bold text-base cursor-pointer">${esc(o.title)}</div>
      <div class="text-xs muted">${esc(o.companyName)} • ${esc(o.city)} • ${esc(o.level)} • ${esc(o.duration)}</div>
      <p class="text-xs muted">${esc(o.desc)}</p>
      <div class="flex gap-2 pt-1">
        <button onclick="go('offer_detail','${o.id}')" class="flex-1 py-2 rounded-xl border text-xs font-semibold">Voir fiche</button>
        <button onclick="applyOffer('${o.id}')" class="flex-1 py-2 rounded-xl ${hasApplied?'bg-emerald-50 text-emerald-700':'bg-electric-500 text-white'} text-xs font-semibold">${hasApplied?'✓ Candidaté':'Candidater'}</button>
      </div>
    </div>`;
  }).join('') || '<div class="card bg-white p-6 rounded-2xl text-center text-xs muted">Aucune offre trouvée. <button onclick="db.filters={q:\'\',city:\'\',sector:\'\',level:\'\',contract:\'\'};saveDB();render()" class="text-electric-500 underline ml-1">Réinitialiser</button></div>';
}

  if (db.cvTheme === 'startup' || db.cvTheme === 'electric') {

        </div>
        <div class="p-5 space-y-3.5 bg-white">
          <div><div class="text-[11px] font-bold uppercase text-electric-500">Profil</div><p class="text-xs mt-1 text-slate-700 leading-relaxed">${esc(cvUser.summary)}</p></div>
          <div><div class="text-[11px] font-bold uppercase text-electric-500">Compétences</div><div class="flex flex-wrap gap-1.5 mt-1">${(cvUser.skills||'').split(',').filter(Boolean).map(s=>`<span class="px-2.5 py-0.5 rounded-full bg-blue-50 text-navy-900 text-[11px] font-semibold">${esc(s.trim())}</span>`).join('')}</div></div>

  } else {
    box.innerHTML = `

function loginDemo(id) { db.currentUserId = id; saveDB(); toast('Connecté !'); go(id === 'u_pro' ? 'company' : 'dashboard'); }
async function registerUser(e) {
  e.preventDefault();
  const role = document.getElementById('regRole').value;
  const dob = document.getElementById('regDob')?.value || '';
  const guardian = document.getElementById('regGuardian')?.value || '';
  if (role === 'CANDIDATE' && dob && calcAge(dob) < 18 && !guardian.includes('@')) {
    return toast('Protection mineur : email du parent/référent requis.');
  }
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPass').value || 'StagePilot2026!';
  const fullName = document.getElementById('regName').value;
  const city = document.getElementById('regCity').value;
  const educationLevel = document.getElementById('regLevel')?.value || 'Lycée';

  if (sb) {
    try {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (!error && data.user) {
        await sb.from('profiles').insert({
          id: data.user.id, role, full_name: fullName, city,
          education_level: educationLevel, guardian_email: guardian || null,
          is_minor: dob ? calcAge(dob) < 18 : false
        });
      }
    } catch {}
  }

  const id = 'u_' + Date.now();
  db.users.push({
    id, role, email, fullName, city, birthDate: dob, guardianEmail: guardian, educationLevel,
    contractType: 'STAGE', availability: 'Dès que possible',
    plan: 'FREE', summary: 'Motivé(e) pour apprendre en entreprise.', skills: 'Sérieux, Travail en équipe', languages: 'Français', interests: '', experiences: [],
    ...(role === 'COMPANY' ? { company: { name: document.getElementById('regCompName').value || fullName, sector: 'Tech', city, verified: false } } : {})
  });
  db.currentUserId = id; saveDB(); toast('Compte créé !'); go(role === 'COMPANY' ? 'company' : 'dashboard');
}
function toggleSave(offerId) {
  const u = currentUser(); if (!u) return go('auth');
  const idx = db.saved.findIndex(s => s.userId === u.id && s.offerId === offerId);
  if (idx >= 0) db.saved.splice(idx, 1); else db.saved.push({ userId: u.id, offerId });
  saveDB(); renderOffersList();
}
function applyOffer(offerId, cover = 'Candidature envoyée via StagePilot.') {
  const u = currentUser(); if (!u) return go('auth');
  if (isMinor(u) && !u.guardianEmail) return toast('Renseignez un email référent légal dans Profil.');
  if (db.applications.some(a => a.userId === u.id && a.offerId === offerId)) return toast('Déjà candidaté !');
  db.applications.push({ id: 'a_' + Date.now(), userId: u.id, offerId, status: 'ENVOYEE', cover, reply: '' });
  saveDB(); toast('✅ Candidature envoyée !');
  if (db.page === 'offers') renderOffersList(); else render();
}
function fillOfferCover(offerId) {
  const o = db.offers.find(x => x.id === offerId);
  const el = document.getElementById('coverMsg');
  if (o && el) el.value = runLocalAI('cover_letter', o.title, currentUser()?.educationLevel, currentUser());
}
function changeAppStatus(id, status) {
  const a = db.applications.find(x => x.id === id); if (a) { a.status = status; saveDB(); toast('Statut mis à jour'); }
}
function setCVTheme(t) { db.cvTheme = t; saveDB(); render(); }
function cvUserEdit(field, val) {
  const target = currentUser() || db.users[0]; target[field] = val; saveDB();
  if (db.page === 'cv') renderCVPreview();
}
function adaptCV() {
  const target = currentUser() || db.users[0];
  const off = document.getElementById('cvTarget').value || 'Stage';
  target.summary = `Candidat(e) en ${target.educationLevel}, motivé(e) pour « ${off} ». Atouts ciblés : ${target.skills}.`;
  saveDB();
  const s = document.getElementById('cvSummaryInput'); if (s) s.value = target.summary;
  renderCVPreview(); toast('✨ CV adapté par l’IA !');
}
function addExp() {
  const target = currentUser() || db.users[0];
  const title = prompt('Intitulé (ex: Stage découverte) :'); if (!title) return;
  const org = prompt('Entreprise / École :') || 'Entreprise';
  target.experiences = target.experiences || [];
  target.experiences.push({ title, org, period: '2026', desc: 'Missions réalisées avec l’équipe.' });
  saveDB(); renderCVPreview();
}
function removeExp(idx) {
  const target = currentUser() || db.users[0];
  if (Array.isArray(target.experiences)) { target.experiences.splice(idx, 1); saveDB(); renderCVPreview(); }
}
function sendAI(e) {
  e.preventDefault();
  const q = document.getElementById('aiInput').value.trim(); if (!q) return;
  const lvl = document.getElementById('aiLvl').value;
  db.aiMessages.push({ role: 'user', text: q });
  db.aiMessages.push({ role: 'ai', text: runLocalAI(db.aiMode, q, lvl, currentUser()) });
  saveDB(); render();
}
function verifyCompany() { const u = currentUser(); if (u?.company) { u.company.verified = true; saveDB(); render(); } }
async function publishOffer(e) {
  e.preventDefault(); const u = currentUser();
  const title = document.getElementById('poTitle').value;
  const city = document.getElementById('poCity').value;
  const contract = document.getElementById('poContract').value;
  const desc = document.getElementById('poDesc').value;

  if (sb) {
    try {
      await sb.from('offers').insert({
        company_id: u.id, company_name: u.company.name, title, city,
        sector: 'Numérique & Tech', education_level: 'Collège / Lycée',
        contract_type: contract, duration: '2 mois', description: desc, is_active: true
      });
    } catch {}
  }

  db.offers.unshift({
    id: 'o_' + Date.now(), companyId: u.id, companyName: u.company.name,
    title, city, sector: 'Numérique & Tech', level: 'Collège / Lycée',
    contract, duration: '2 mois', isDemo: false, desc
  });
  saveDB(); toast('✅ Offre publiée !'); render();
}
function replyApp(id, status) {
  const a = db.applications.find(x => x.id === id); if (!a) return;
  a.status = status; a.reply = prompt('Message au candidat :') || (status === 'ENTRETIEN' ? 'Nous aimerions vous rencontrer.' : 'Merci pour votre candidature.');
  saveDB(); render();
}
function togglePlan() {
  const u = currentUser(); if (!u) return go('auth');
  u.plan = u.plan === 'PREMIUM' ? 'FREE' : 'PREMIUM'; saveDB(); render();
}
function deleteMyAccount() {
  const u = currentUser(); if (!u || !confirm('Supprimer votre compte (RGPD) ?')) return;
  db.users = db.users.filter(x => x.id !== u.id);
  db.applications = db.applications.filter(a => a.userId !== u.id);
  db.currentUserId = null; saveDB(); go('home'); toast('Données supprimées.');
}

render();
syncFromSupabase();
</script>
</body>
</html>
